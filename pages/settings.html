<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Animei — Settings</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../img/icons/180x180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="../css/app.css" rel="stylesheet">
</head>
<body>
<div class="app">
    <header class="header">
        <div class="header__left">
            <a class="icon-btn" href="../index.html" aria-label="Назад" data-i18n-aria="study.back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </a>
        </div>
        <div class="header__logo" data-i18n="settings.title">Настройки</div>
        <div class="header__right">
            <div class="profile-wrap">
                <button class="icon-btn profile-btn" aria-label="Profile">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
                <div class="profile-menu" id="profile-menu">
                    <a href="#" id="logout-btn" data-i18n="nav.logout">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <main class="main settings-page">
        <!-- ОФОРМЛЕНИЕ -->
        <section class="settings-card">
            <div class="settings-card__title" data-i18n="settings.appearance">Оформление</div>
            <div class="settings-row">
                <label data-i18n="settings.theme">Тема</label>
                <div class="seg" id="set-theme">
                    <button type="button" data-val="dark" data-i18n="settings.theme.dark">Тёмная</button>
                    <button type="button" data-val="light" data-i18n="settings.theme.light">Светлая</button>
                    <button type="button" data-val="system" data-i18n="settings.theme.system">Как в системе</button>
                </div>
            </div>
            <div class="settings-row">
                <label data-i18n="settings.language">Язык</label>
                <select class="settings-select" id="set-language">
                    <option value="ru">Русский</option>
                    <option value="uk">Українська</option>
                    <option value="en">English</option>
                </select>
            </div>
        </section>

        <!-- СУБТИТРЫ -->
        <section class="settings-card">
            <div class="settings-card__title" data-i18n="settings.subs">Субтитры</div>
            <div class="settings-row">
                <label data-i18n="settings.subSize">Размер субтитров</label>
                <div class="seg" id="set-subSize">
                    <button type="button" data-val="sm" data-i18n="settings.size.sm">Мелкий</button>
                    <button type="button" data-val="md" data-i18n="settings.size.md">Средний</button>
                    <button type="button" data-val="lg" data-i18n="settings.size.lg">Крупный</button>
                </div>
            </div>
            <label class="settings-toggle">
                <span data-i18n="settings.playerRomaji">Ромадзи в плеере по умолчанию</span>
                <input type="checkbox" id="set-playerRomaji">
            </label>
            <label class="settings-toggle">
                <span data-i18n="settings.playerTranslation">Показывать перевод субтитров</span>
                <input type="checkbox" id="set-playerTranslation">
            </label>
            <label class="settings-toggle">
                <span data-i18n="settings.autoSync">Автосинхронизация субтитров</span>
                <input type="checkbox" id="set-autoSyncSubs">
            </label>
        </section>

        <!-- ВОСПРОИЗВЕДЕНИЕ -->
        <section class="settings-card">
            <div class="settings-card__title" data-i18n="settings.playback">Воспроизведение и звук</div>
            <div class="settings-row">
                <label data-i18n="settings.volume">Громкость по умолчанию</label>
                <input type="range" class="settings-range" id="set-volume" min="0" max="1" step="0.05">
            </div>
            <label class="settings-toggle">
                <span data-i18n="settings.autopause">Авто-пауза после реплики</span>
                <input type="checkbox" id="set-autopause">
            </label>
            <label class="settings-toggle">
                <span data-i18n="settings.loopClips">Зацикливать клипы слов</span>
                <input type="checkbox" id="set-loopClips">
            </label>
        </section>

        <!-- АККАУНТ -->
        <section class="settings-card" id="account-card">
            <div class="settings-card__title" data-i18n="settings.account">Аккаунт</div>
            <div id="account-state"></div>
            <div id="password-block" hidden>
                <h3 data-i18n="settings.changePassword">Смена пароля</h3>
                <input type="password" id="cur-pass" autocomplete="current-password" data-i18n-placeholder="settings.currentPassword" placeholder="Текущий пароль">
                <input type="password" id="new-pass" autocomplete="new-password" data-i18n-placeholder="settings.newPassword" placeholder="Новый пароль">
                <button type="button" class="btn btn--primary" id="save-pass" data-i18n="settings.savePassword">Обновить пароль</button>
            </div>
        </section>
    </main>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar__brand">Animei</div>
        <div class="sidebar__version">v0.0.59</div>
        <a href="../index.html" data-i18n="nav.home">Главная</a>
        <a href="./catalog.html" data-i18n="nav.catalog">Каталог</a>
        <a href="./news.html" data-i18n="nav.news">Новости</a>
        <a href="./watch.html" data-i18n="nav.watch">Своё видео</a>
        <a href="./words.html" data-i18n="nav.dictionary">Словарь</a>
        <a href="./feedback.html" data-i18n="nav.feedback">Обратная связь</a>
    </nav>
    <div class="overlay" id="overlay"></div>
</div>

<script src="../libs/axios/axios.min.js"></script>
<script src="../libs/snackbar/snackbar.js"></script>
<script src="../js/settings.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/axiosClient.js"></script>
<script src="../js/app.js"></script>
<script src="../js/settings-page.js"></script>
<script src="../js/stats.js"></script>
</body>
</html>
