<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Animei</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../img/icons/180x180.png">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="icon" type="image/png" href="../img/favicon.png">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link href="../css/app.css" rel="stylesheet">
    <script>
        // Пакет переводов uk/en грузим лениво и только для выбранного языка;
        // русский встроен в i18n.js. Выбор зеркалит detectLang() из i18n.js.
        (function () {
            var langs = { ru: 1, uk: 1, en: 1 };
            var lang = null;
            try { lang = localStorage.getItem('animei:lang'); } catch (e) { /* приватный режим */ }
            if (!langs[lang]) {
                lang = 'ru';
                var prefs = [navigator.language].concat(navigator.languages || []);
                for (var i = 0; i < prefs.length; i++) {
                    var c = String(prefs[i] || '').toLowerCase().split('-')[0];
                    if (langs[c]) { lang = c; break; }
                }
            }
            if (lang !== 'ru') document.write('<scr' + 'ipt src="../js/i18n/' + lang + '.js" defer></scr' + 'ipt>');
        })();
    </script>
</head>
<body>
<div class="app">
    <header class="header header--flush-left">
        <div class="header__left">
            <button class="icon-btn menu-btn" aria-label="Menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
        </div>
        <div class="header__logo">
            <img src="../favicon.svg" alt="" class="header__logo-mark">
            <span class="header__logo-text">Animei</span>
        </div>
        <form class="header__search" role="search"><button type="button" class="icon-btn header__search-toggle" aria-label="Search" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button><input class="header__search-input" name="q" type="search" autocomplete="off" data-i18n-placeholder="header.search" placeholder="Поиск аниме"></form>
        <div class="header__right">
            <div class="profile-wrap">
                <button class="icon-btn profile-btn" aria-label="Profile">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
                <div class="profile-menu" id="profile-menu">
                    <a href="#" id="logout-btn">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <main class="main study">
        <div class="study-stats"></div>
        <div class="study-progress"><div class="study-progress__bar"></div></div>

        <div class="card-area">
            <div class="front-side"></div>
            <div class="back-side"></div>
        </div>
        <div class="buttons"></div>


        <div id="open-modal-btn" class="hint-btn hidden cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50">
                <path fill="currentColor" d="M25,2C12.297,2,2,12.297,2,25s10.297,23,23,23s23-10.297,23-23S37.703,2,25,2z M25,11c1.657,0,3,1.343,3,3s-1.343,3-3,3s-3-1.343-3-3S23.343,11,25,11z M29,38h-2h-4h-2v-2h2V23h-2v-2h2h4v2v13h2V38z"/>
            </svg>
        </div>

        <div id="modal-overlay" class="modal-overlay hidden">
            <div class="modal">
                <div id="modal-content"></div>
                <button id="close-modal-btn" data-i18n="study.close">Закрыть</button>
            </div>
        </div>
    </main>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar__brand">Animei</div>
        <a href="../index.html" data-i18n="nav.home">Главная</a>
        <a href="./catalog.html" data-i18n="nav.catalog">Поиск аниме</a>
        <a href="./watch.html" data-i18n="nav.watch">Своё видео</a>
        <a href="./words.html" data-i18n="nav.dictionary">Мои слова</a>
        <a href="/news/" data-i18n="nav.news">JP News</a>
        <a href="./feedback.html" data-i18n="nav.feedback">Обратная связь</a>
    </nav>
    <div class="overlay" id="overlay"></div>
</div>

<script src="../libs/axios/axios.min.js" defer></script>
<script src="../libs/snackbar/snackbar.js" defer></script>
<script src="../js/settings.js" defer></script>
<script src="../js/i18n.js" defer></script>
<script src="../js/speech.js" defer></script>
<script src="../js/axiosClient.js" defer></script>
<script src="../js/video-store.js" defer></script>
<script src="../js/words-store.js" defer></script>
<script src="../js/clip-trim.js" defer></script>
<script src="../js/word-edit.js" defer></script>
<script src="../js/app.js" defer></script>
<script src="../js/starter-deck.js" defer></script>
<script src="../js/romaji.js" defer></script>
<script src="../js/study-core.js" defer></script>
<script src="../js/custom-study.js" defer></script>
<script src="../js/stats.js" defer></script>
</body>
</html>
