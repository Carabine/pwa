<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.catalog">Каталог — Animei</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../img/icons/180x180.png">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="icon" type="image/png" href="../img/favicon.png">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <script>
        // Тему ставим ДО первой отрисовки. js/settings.js подключён с defer и
        // выполняется уже после того, как браузер нарисовал первый кадр, —
        // из-за этого светлая тема на каждой загрузке вспыхивала тёмной.
        // Логика зеркалит effectiveTheme() из js/settings.js.
        (function () {
            var th = 'dark';
            try {
                var s = JSON.parse(localStorage.getItem('animei:settings') || '{}');
                if (s && s.theme) th = s.theme;
            } catch (e) { /* приватный режим */ }
            if (th === 'system') {
                th = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
                    ? 'light' : 'dark';
            }
            th = th === 'light' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', th);
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', th === 'light' ? '#f4f5fa' : '#0a0a0f');
        })();
    </script>
    <link href="../css/app.css" rel="stylesheet">
    <link href="../css/catalog.css" rel="stylesheet">
    <script>
        // Пакет переводов uk/en грузим лениво и только для выбранного языка;
        // русский встроен в i18n.js. Выбор зеркалит detectLang() из i18n.js.
        (function () {
            var langs = { ru: 1, uk: 1, en: 1 };
            var lang = null;
            try { lang = localStorage.getItem('animei:lang'); } catch (e) { /* приватный режим */ }
            if (!langs[lang]) {
                lang = 'ru';
                var prefs = [navigator.language].concat(navigator.languages || []);
                for (var i = 0; i < prefs.length; i++) {
                    var c = String(prefs[i] || '').toLowerCase().split('-')[0];
                    if (langs[c]) { lang = c; break; }
                }
            }
            if (lang !== 'ru') document.write('<scr' + 'ipt src="../js/i18n/' + lang + '.js" defer></scr' + 'ipt>');
        })();
    </script>
</head>
<body>
<div class="app">
    <header class="header header--flush-left">
        <div class="header__left">
            <button class="icon-btn menu-btn" aria-label="Menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
        </div>
        <div class="header__logo">
            <img src="../favicon.svg" alt="" class="header__logo-mark">
            <span class="header__logo-text">Animei</span>
        </div>
        <!-- На самой странице поиска есть большое поле ввода в теле каталога,
             поэтому дублирующий поиск в шапке убран (см. .catalog__search). -->
        <div class="header__right">
            <div class="profile-wrap">
                <button class="icon-btn profile-btn" aria-label="Profile">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
                <div class="profile-menu" id="profile-menu">
                    <a href="#" id="logout-btn" data-i18n="nav.logout">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <main class="catalog">
        <div class="catalog__search">
            <svg class="catalog__search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="search-input" type="text" data-i18n-placeholder="catalog.placeholder" placeholder="Название аниме — например, Фрирен или Naruto" autocomplete="off">
        </div>

        <p class="catalog__hint" data-i18n="catalog.hint">Открой любое аниме и кликай по словам в субтитрах — они попадут в твой словарь и в карточки для изучения.</p>

        <div class="catalog__chips" id="diff-chips">
            <button type="button" class="catalog-chip catalog-chip--active" data-val="all" data-i18n="catalog.filter.all">Все</button>
            <button type="button" class="catalog-chip" data-val="easy" data-i18n="catalog.filter.easy">🎓 Полегче</button>
        </div>

        <h2 id="heading" class="catalog__heading" data-i18n="catalog.popular">Популярное</h2>
        <!-- Плейсхолдеры стоят прямо в разметке, а не рисуются скриптом: сетка
             занимает своё место уже в первом кадре, до того как доедет
             catalog.js. Дальше их переписывает renderSkeletons()/карточки. -->
        <div id="results" class="catalog__grid"><div class="skeleton skel"></div><div class="skeleton skel"></div><div class="skeleton skel"></div><div class="skeleton skel"></div><div class="skeleton skel"></div><div class="skeleton skel"></div><div class="skeleton skel"></div><div class="skeleton skel"></div><div class="skeleton skel"></div><div class="skeleton skel"></div><div class="skeleton skel"></div><div class="skeleton skel"></div></div>
        <div id="status" class="catalog__status" style="display:none"></div>
    </main>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar__brand">Animei</div>
        <a href="../index.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/></svg><span class="nav-label" data-i18n="nav.home">Главная</span></a>
        <a href="./catalog.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span class="nav-label" data-i18n="nav.catalog">Поиск аниме</span></a>
        <a href="./watch.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polygon points="10 9 16 12 10 15 10 9" fill="currentColor" stroke="none"/></svg><span class="nav-label" data-i18n="nav.watch">Своё видео</span></a>
        <a href="./words.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span class="nav-label" data-i18n="nav.dictionary">Мои слова</span></a>
    </nav>
    <div class="overlay" id="overlay"></div>
</div>

<script src="../libs/axios/axios.min.js" defer></script>
<script src="../js/snackbar.js" defer></script>
<script src="../js/settings.js" defer></script>
<script src="../js/i18n.js" defer></script>
<script src="../js/axiosClient.js" defer></script>
<script src="../js/app.js" defer></script>
<script src="../js/anime-difficulty.js" defer></script>
<script src="../js/catalog.js" defer></script>
<script src="../js/stats.js" defer></script>
</body>
</html>
