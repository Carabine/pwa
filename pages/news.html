<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новости — Animei</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../img/icons/180x180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="../css/app.css" rel="stylesheet">
    <link href="../css/news.css" rel="stylesheet">
</head>
<body>
<div class="app">
    <header class="header">
        <div class="header__left">
            <button class="icon-btn menu-btn" aria-label="Menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <a href="../index.html" class="icon-btn" aria-label="Home">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
            </a>
        </div>
        <div class="header__logo" data-i18n="news.title">Новости</div>
        <div class="header__right">
            <div class="profile-wrap">
                <button class="icon-btn profile-btn" aria-label="Profile">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
                <div class="profile-menu" id="profile-menu">
                    <a href="#" id="logout-btn" data-i18n="nav.logout">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <main class="news" id="news">
        <p class="news__intro" data-i18n="news.intro">Настоящие новости NHK на японском. Кликай по словам — попадут в словарь и карточки. Значок уровня и полоска показывают сложность по JLPT, а «ты знаешь %» — сколько слов из статьи уже в твоей коллекции.</p>

        <div class="news-cats" id="news-cats"></div>

        <div class="news-grid" id="news-grid"></div>
        <div class="news-status" id="news-status" style="display:none"></div>

        <!-- Ридер одной статьи -->
        <div class="news-reader" id="news-reader">
            <button class="news-back" id="news-back" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                <span data-i18n="news.back">К списку</span>
            </button>

            <div class="news-reader__opts">
                <button class="news-opt is-active" id="news-furigana" type="button" data-i18n="news.furigana">あ Фуригана</button>
                <button class="news-opt is-active" id="news-ru" type="button" data-i18n="news.ru">RU перевод</button>
            </div>

            <h1 class="news-reader__title" id="news-reader-title"></h1>
            <div class="news-reader__title-ru" id="news-reader-title-ru"></div>
            <div class="news-reader__meta" id="news-reader-meta"></div>
            <div id="news-reader-body"></div>
        </div>
    </main>

    <!-- Попап словаря (как в плеере) -->
    <div class="word-popup" id="word-popup" hidden>
        <div class="word-popup__head">
            <div>
                <div class="word-popup__word" id="popup-word"></div>
                <div class="word-popup__reading" id="popup-reading"><span id="popup-reading-text"></span></div>
            </div>
            <button class="word-popup__close" id="popup-close" aria-label="Закрыть">✕</button>
        </div>
        <div class="word-popup__body" id="popup-body"></div>
        <div class="word-popup__sentence" id="popup-sentence"></div>
        <button class="word-popup__save" id="popup-save" data-i18n="popup.save">+ В коллекцию</button>
    </div>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar__brand">Animei</div>
        <div class="sidebar__version">v0.0.58</div>
        <a href="../index.html" data-i18n="nav.home">Главная</a>
        <a href="./catalog.html" data-i18n="nav.catalog">Каталог</a>
        <a href="./news.html" class="active" data-i18n="nav.news">Новости</a>
        <a href="./watch.html" data-i18n="nav.watch">Своё видео</a>
        <a href="./words.html" data-i18n="nav.dictionary">Словарь</a>
        <a href="./feedback.html" data-i18n="nav.feedback">Обратная связь</a>
    </nav>
    <div class="overlay" id="overlay"></div>
</div>

<script src="../libs/axios/axios.min.js"></script>
<script src="../libs/snackbar/snackbar.js"></script>
<script src="../js/settings.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/speech.js"></script>
<script src="../js/axiosClient.js"></script>
<script src="../js/words-store.js"></script>
<script src="../js/app.js"></script>
<script src="../js/news.js"></script>
<script src="../js/stats.js"></script>
</body>
</html>
