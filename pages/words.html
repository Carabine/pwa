<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Animei - Dictionary</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../img/icons/180x180.png">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="icon" type="image/png" href="../img/favicon.png">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="../css/app.css" rel="stylesheet">
</head>
<body>
<div class="app">
    <header class="header header--flush-left">
        <div class="header__left">
            <button class="icon-btn menu-btn" aria-label="Menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
        </div>
        <div class="header__logo">
            <img src="../favicon.svg" alt="" class="header__logo-mark">
            <span class="header__logo-text">Animei</span>
        </div>
        <form class="header__search" role="search"><button type="button" class="icon-btn header__search-toggle" aria-label="Search" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button><input class="header__search-input" name="q" type="search" autocomplete="off" data-i18n-placeholder="header.search" placeholder="Поиск аниме"></form>
        <div class="header__right">
            <div class="profile-wrap">
                <button class="icon-btn profile-btn" aria-label="Profile">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
                <div class="profile-menu" id="profile-menu">
                    <a href="#" id="logout-btn">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div class="dictionary">
        <h2 class="dictionary__title">
            <span data-i18n="words.title">Словарь</span>
            <span class="dictionary__count" id="words-count" hidden></span>
        </h2>
        <div class="words-toolbar">
            <label class="words-filter">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="words-filter" autocomplete="off" data-i18n-placeholder="words.filter" placeholder="Поиск по слову или переводу…">
            </label>
            <!-- Обмен с Anki: экспорт словаря в TSV (Anki принимает без настройки)
                 и импорт такого же файла обратно. Обработчики — в words.js. -->
            <div class="words-toolbar__actions">
                <button class="btn btn--ghost" id="export-btn" data-i18n="words.export" data-i18n-title="words.export.title" title="Файл подходит для Anki и как резервная копия">Экспорт в Anki</button>
            </div>
        </div>
        <!-- Опциональные колоды: подсказка, чип-ряд фильтра и кнопка «Учить».
             Наполняются из js/decks-ui.js; пока колод нет — почти незаметны. -->
        <div class="deck-hint" id="deck-hint" hidden></div>
        <div class="deck-chips" id="deck-chips" hidden></div>
        <div class="deck-study" id="deck-study" hidden></div>
        <div class="words-list"></div>
    </div>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar__brand">Animei</div>
        <div class="sidebar__version">v0.0.90</div>
        <a href="../index.html" data-i18n="nav.home">Главная</a>
        <a href="./catalog.html" data-i18n="nav.catalog">Поиск аниме</a>
        <a href="./watch.html" data-i18n="nav.watch">Своё видео</a>
        <a href="./words.html" class="active" data-i18n="nav.dictionary">Словарь</a>
        <a href="/news/" data-i18n="nav.news">JP News</a>
        <a href="./feedback.html" data-i18n="nav.feedback">Обратная связь</a>
    </nav>
    <div class="overlay" id="overlay"></div>
</div>

<script src="../libs/axios/axios.min.js"></script>
<script src="../libs/snackbar/snackbar.js"></script>
<script src="../js/settings.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/axiosClient.js"></script>
<script src="../js/video-store.js"></script>
<script src="../js/words-store.js"></script>
<script src="../js/decks-store.js"></script>
<script src="../js/clip-trim.js"></script>
<script src="../js/word-edit.js"></script>
<script src="../js/app.js"></script>
<script src="../js/decks-ui.js"></script>
<script src="../js/words.js"></script>
<script src="../js/stats.js"></script>
</body>
</html>
