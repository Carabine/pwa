<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Animei - Dictionary</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../img/icons/180x180.png">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="icon" type="image/png" href="../img/favicon.png">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <script>
        // Тему ставим ДО первой отрисовки. js/settings.js подключён с defer и
        // выполняется уже после того, как браузер нарисовал первый кадр, —
        // из-за этого светлая тема на каждой загрузке вспыхивала тёмной.
        // Логика зеркалит effectiveTheme() из js/settings.js.
        (function () {
            var th = 'dark';
            try {
                var s = JSON.parse(localStorage.getItem('animei:settings') || '{}');
                if (s && s.theme) th = s.theme;
            } catch (e) { /* приватный режим */ }
            if (th === 'system') {
                th = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
                    ? 'light' : 'dark';
            }
            th = th === 'light' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', th);
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', th === 'light' ? '#f4f5fa' : '#0a0a0f');
        })();
    </script>
    <link href="../css/app.css" rel="stylesheet">
    <script>
        // Пакет переводов uk/en грузим лениво и только для выбранного языка;
        // русский встроен в i18n.js. Выбор зеркалит detectLang() из i18n.js.
        (function () {
            var langs = { ru: 1, uk: 1, en: 1 };
            var lang = null;
            try { lang = localStorage.getItem('animei:lang'); } catch (e) { /* приватный режим */ }
            if (!langs[lang]) {
                lang = 'ru';
                var prefs = [navigator.language].concat(navigator.languages || []);
                for (var i = 0; i < prefs.length; i++) {
                    var c = String(prefs[i] || '').toLowerCase().split('-')[0];
                    if (langs[c]) { lang = c; break; }
                }
            }
            if (lang !== 'ru') document.write('<scr' + 'ipt src="../js/i18n/' + lang + '.js" defer></scr' + 'ipt>');
        })();
    </script>
</head>
<body>
<div class="app">
    <header class="header header--flush-left">
        <div class="header__left">
            <button class="icon-btn menu-btn" aria-label="Menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
        </div>
        <div class="header__logo">
            <img src="../favicon.svg" alt="" class="header__logo-mark">
            <span class="header__logo-text">Animei</span>
        </div>
        <form class="header__search" role="search"><button type="button" class="icon-btn header__search-toggle" aria-label="Search" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button><input class="header__search-input" name="q" type="search" autocomplete="off" data-i18n-placeholder="header.search" placeholder="Поиск аниме"></form>
        <div class="header__right">
            <div class="profile-wrap">
                <button class="icon-btn profile-btn" aria-label="Profile">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
                <div class="profile-menu" id="profile-menu">
                    <a href="#" id="logout-btn">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div class="dictionary">
        <h2 class="dictionary__title">
            <span data-i18n="words.title">Мои слова</span>
            <span class="dictionary__count" id="words-count" hidden></span>
        </h2>
        <div class="words-toolbar">
            <label class="words-filter">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="words-filter" autocomplete="off" data-i18n-placeholder="words.filter" placeholder="Поиск по слову или переводу…">
                <!-- Короткий плейсхолдер для узкого экрана ставим ДО первой
                     отрисовки — поздняя подмена из JS видна как мигание. -->
                <script>
                    (function () {
                        if (!matchMedia('(max-width: 560px)').matches) return;
                        var el = document.getElementById('words-filter');
                        el.placeholder = 'Поиск слова…';
                        el.setAttribute('data-i18n-placeholder', 'words.filterShort');
                    })();
                </script>
            </label>
            <!-- Инструменты: режим выбора и меню «⋯» (сортировка, вид, экспорт,
                 известные слова — всё низкочастотное убрано с глаз). Логика — words.js. -->
            <div class="words-toolbar__controls">
                <button class="btn btn--ghost" id="select-btn" data-i18n="words.select">Выбрать</button>
                <button class="btn btn--ghost words-tool" id="words-menu-btn" aria-label="More">⋯</button>
                <!-- Меню «⋯» — только действия. Всё, что меняет вид списка
                     (колода, сортировка, вид), живёт в модалке «Фильтры»
                     (воронка рядом с пилюлей колоды, js/words.js). -->
                <div class="words-menu" id="words-menu" hidden>
                    <button id="export-anki-btn" data-i18n="words.exportAnki" data-i18n-title="words.exportAnki.title" title="Готовая колода с аудио или видео из ваших клипов">Экспорт в Anki</button>
                    <button id="export-btn" data-i18n="words.export" data-i18n-title="words.export.title" title="Простой текстовый файл — резервная копия">Экспорт (текст)</button>
                    <hr class="words-menu__hr">
                    <button id="import-known-btn" data-i18n="known.import">Импорт известных слов</button>
                    <button id="known-btn"><span data-i18n="known.title">Известные слова</span> <span class="words-menu__count" id="known-count" hidden></span></button>
                </div>
            </div>
        </div>
        <!-- Опциональные колоды: подсказка, кнопка выбора колоды и кнопка «Учить».
             Наполняются из js/decks-ui.js; пока колод нет — почти незаметны. -->
        <div class="deck-hint" id="deck-hint" hidden></div>
        <div class="deck-chips" id="deck-chips" hidden></div>
        <div class="deck-study" id="deck-study" hidden></div>
        <div class="words-list"></div>
        <script>
            // Скелетон списка рисуем ПРЯМО ЗДЕСЬ, при разборе страницы: так
            // место под слова занято уже в первом кадре, а не после того как
            // доедет words.js. Сколько строк — знаем из локальной копии
            // коллекции; вид (список/карточки) — из настроек. Функция остаётся
            // глобальной, loadWords() зовёт её повторно как страховку.
            window.animeiWordsSkeleton = function () {
                var el = document.querySelector('.words-list');
                if (!el) return;
                var cached = 0, view = 'list';
                var count = function (k) {
                    try {
                        var v = JSON.parse(localStorage.getItem(k) || 'null');
                        return Array.isArray(v) ? v.length : 0;
                    } catch (e) { return 0; }
                };
                try {
                    // Канонические копии коллекции: animei:wordsCache у вошедшего,
                    // animei:guestWords у гостя. Ключ words — производный, его
                    // пишет только главная, так что сам по себе он ненадёжен.
                    cached = Math.max(count('animei:wordsCache'), count('animei:guestWords'), count('words'));
                    view = localStorage.getItem('animei:wordsView') === 'cards' ? 'cards' : 'list';
                } catch (e) { /* приватный режим */ }
                var rows = Math.min(Math.max(cached || 7, 3), 10);
                var jp = [58, 46, 72, 52, 64, 44, 68, 50, 60, 48];
                var html = '';
                for (var i = 0; i < rows; i++) {
                    var w = jp[i % jp.length], tr = 90 + (i % 4) * 26;
                    html += view === 'list'
                        ? '<div class="word-row is-skel"><div class="word-row__jp">'
                            + '<span class="word-row__kanji"><i class="skel skel-bar" style="width:' + w + 'px"></i></span>'
                            + '</div><div class="word-row__tr"><i class="skel skel-bar" style="width:' + tr + 'px"></i></div></div>'
                        : '<div class="word-card word-read-content is-skel"><div class="word-card__head">'
                            + '<span class="word-card__kanji"><i class="skel skel-bar" style="width:' + w + 'px"></i></span>'
                            + '</div><div class="word-card__meaning"><i class="skel skel-bar" style="width:' + tr + 'px"></i></div>'
                            + '<div class="word-card__sentence"><i class="skel skel-bar" style="width:80%"></i></div></div>';
                }
                el.className = 'words-list' + (view === 'list' ? ' words-list--rows' : '');
                el.innerHTML = html;
            };
            window.animeiWordsSkeleton();
        </script>
    </div>

        <a href="./watch.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polygon points="10 9 16 12 10 15 10 9" fill="currentColor" stroke="none"/></svg><span class="nav-label" data-i18n="nav.watch">Своё видео</span></a>
        <a href="./words.html" class="active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span class="nav-label" data-i18n="nav.dictionary">Мои слова</span></a>
        <a href="/news/"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13v14a2 2 0 0 0 2 2H5a2 2 0 0 1-2-2V6a1 1 0 0 1 1-1z"/><line x1="7" y1="9" x2="14" y2="9"/><line x1="7" y1="13" x2="14" y2="13"/><line x1="7" y1="17" x2="11" y2="17"/></svg><span class="nav-label" data-i18n="nav.news">JP News</span><span class="nav-new">NEW</span></a>

</div>
