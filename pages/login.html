<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Animei - Login</title>
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../img/icons/180x180.png">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="icon" type="image/png" href="../img/favicon.png">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <script>
        // Тему ставим ДО первой отрисовки. js/settings.js подключён с defer и
        // выполняется уже после того, как браузер нарисовал первый кадр, —
        // из-за этого светлая тема на каждой загрузке вспыхивала тёмной.
        // Логика зеркалит effectiveTheme() из js/settings.js.
        (function () {
            var th = 'dark';
            try {
                var s = JSON.parse(localStorage.getItem('animei:settings') || '{}');
                if (s && s.theme) th = s.theme;
            } catch (e) { /* приватный режим */ }
            if (th === 'system') {
                th = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
                    ? 'light' : 'dark';
            }
            th = th === 'light' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', th);
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', th === 'light' ? '#f4f5fa' : '#0a0a0f');
        })();
    </script>
    <link href="../css/app.css" rel="stylesheet">
    <script>
        // Пакет переводов uk/en грузим лениво и только для выбранного языка;
        // русский встроен в i18n.js. Выбор зеркалит detectLang() из i18n.js.
        (function () {
            var langs = { ru: 1, uk: 1, en: 1 };
            var lang = null;
            try { lang = localStorage.getItem('animei:lang'); } catch (e) { /* приватный режим */ }
            if (!langs[lang]) {
                lang = 'ru';
                var prefs = [navigator.language].concat(navigator.languages || []);
                for (var i = 0; i < prefs.length; i++) {
                    var c = String(prefs[i] || '').toLowerCase().split('-')[0];
                    if (langs[c]) { lang = c; break; }
                }
            }
            if (lang !== 'ru') document.write('<scr' + 'ipt src="../js/i18n/' + lang + '.js" defer></scr' + 'ipt>');
            // Тексты в разметке русские: на другом языке форма мелькала по-русски и
            // переводилась на глазах. Прячем её (место занято), пока login.js не
            // применит перевод; страховка — показать через 2 с в любом случае.
            if (lang !== 'ru') {
                var root = document.documentElement;
                root.classList.add('i18n-pending');
                setTimeout(function () { root.classList.remove('i18n-pending'); }, 2000);
            }
        })();
    </script>
    <style>html.i18n-pending .login-form { visibility: hidden; }</style>
</head>
<body>
<div class="app">
    <header class="header header--flush-left">
        <div class="header__left"></div>
        <div class="header__logo">
            <img src="../favicon.svg" alt="" class="header__logo-mark">
            <span class="header__logo-text">Animei</span>
        </div>
        <div class="header__right"></div>
    </header>

    <main class="main">
        <!-- Вход — лаконичный вариант A (05.10.2026): без карточки и подписей,
             почта сверху, Google под ней, ссылки одной строкой. -->
        <div class="login-form login-form--min">
            <div class="login-form__mark" aria-hidden="true">あ</div>
            <h2 class="login-form__title" id="auth-title">Вход в Animei</h2>
            <form id="auth-form">
                <div class="form-group">
                    <label for="email" class="sr-only" data-i18n="auth.email">Почта</label>
                    <input type="email" id="email" placeholder="Почта" data-i18n-placeholder="auth.email" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password" class="sr-only" data-i18n="auth.password">Пароль</label>
                    <div class="pw-field">
                        <input type="password" id="password" placeholder="Пароль" data-i18n-placeholder="auth.password" autocomplete="current-password">
                        <button type="button" class="pw-field__eye" id="pw-toggle" data-i18n-aria="aria.showPassword" aria-label="Показать пароль" tabindex="-1">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" id="submit-btn" class="btn btn--primary btn--block">Войти</button>
            </form>
            <!-- Вход через Google: место под кнопку занято сразу (заглушка той же формы),
                 чтобы появление кнопки не сдвигало страницу; прячется, если Google выключен -->
            <div class="oauth" id="google-login">
                <div class="oauth__or"><span data-i18n="auth.or">или</span></div>
                <button type="button" class="oauth__google" id="google-btn" disabled>
                    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
                    <span data-i18n="auth.google">Войти через Google</span>
                </button>
            </div>
            <div class="login-form__links">
                <a href="./reset.html" class="login-form__forgot" id="forgot-link" data-i18n="auth.forgot">Забыли пароль?</a>
                <span class="login-form__dot" id="links-dot" aria-hidden="true">·</span>
                <button type="button" id="toggle-mode" class="login-form__toggle">Создать аккаунт</button>
            </div>
            <a href="../index.html" class="login-form__back" data-i18n="auth.skip">Продолжить без входа</a>
        </div>
    </main>
</div>

<script src="../libs/axios/axios.min.js" defer></script>
<script src="../js/snackbar.js" defer></script>
<script src="../js/settings.js" defer></script>
<script src="../js/i18n.js" defer></script>
<script src="../js/axiosClient.js" defer></script>
<script src="../js/video-store.js" defer></script>
<script src="../js/words-store.js" defer></script>
<script src="../js/decks-store.js" defer></script>
<script src="../js/app.js" defer></script>
<script src="../js/downloads.js" defer></script>
<script src="../js/login.js" defer></script>
<script src="../js/stats.js" defer></script>
<script src="../js/guest-mirror.js" defer></script>
</body>
</html>
