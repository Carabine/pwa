<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Админка Animei</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<meta name="theme-color" content="#0a0a0f">
<style>
    :root {
        --bg: #0d0f14;
        --card: #161920;
        --card2: #1d212a;
        --text: #eceef2;
        --muted: #8b919c;
        --faint: #5d636e;
        --accent: #8aa4ff;
        --accent2: #34405e;
        --border: #242834;
        --ok: #5fd08a;
        --warn: #f2c14e;
        --bad: #ff7676;
        /* ниже по файлу местами зовутся так — держим синонимы, иначе рамки пропадали */
        --line: var(--border);
        --fg: var(--text);
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px 16px 48px;
    }
    .wrap { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 14px; letter-spacing: -.01em; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .h1-sub { color: var(--faint); font-size: 12px; font-weight: 400; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tabs button {
        background: var(--card); color: var(--text); border: 1px solid var(--border);
        padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .tabs button.active { background: var(--accent); border-color: var(--accent); color: #0f1115; font-weight: 600; }

    .tab { display: none; }
    .tab.active { display: block; }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .card .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .card .value { font-size: 28px; font-weight: 700; }
    .card .value.ok { color: var(--ok); }
    .card .value.bad { color: var(--bad); }

    .section-title { font-size: 15px; margin: 24px 0 12px; }
    .note {
        background: var(--card); border: 1px solid var(--accent2); border-left: 3px solid var(--accent);
        border-radius: 10px; padding: 10px 14px; font-size: 13px; color: var(--muted); margin-bottom: 16px;
    }
    .note b { color: var(--text); font-weight: 600; }

    /* Таблицы живут в скролл-обёртке .tblwrap: на телефоне широкая таблица
       скроллится по горизонтали внутри неё, а не распирает всю страницу.
       Скругление — на обёртке (overflow:hidden на самой таблице резал бы скролл). */
    .tblwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; background: var(--card); }
    th, td { text-align: left; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; background: var(--card2); }
    td.num, th.num { text-align: right; }
    tr:last-child td { border-bottom: none; }

    .msg { color: var(--muted); padding: 40px 0; text-align: center; }
    /* Источники: строка на источник, точка состояния слева. Смотреть надо
       глазами и быстро — «что сегодня отвалилось», поэтому цвет несёт смысл,
       а подпись рядом объясняет, чем это грозит. */
    .src { display: flex; align-items: baseline; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--border); }
    .src:last-child { border-bottom: 0; }
    .srcgrp { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; }
    .srcgrp__head { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .src__dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; align-self: center; }
    .src__dot--ok { background: var(--ok); }
    .src__dot--bad { background: var(--bad); }
    .src__dot--off { background: var(--muted); }
    .src__name { font-size: 13.5px; font-weight: 600; flex: 0 0 auto; }
    .src__note { font-size: 12.5px; color: var(--muted); flex: 1 1 auto; }
    .src__note--bad { color: var(--bad); }
    .src__hint { display: block; font-size: 11.5px; color: var(--muted); opacity: .75; }
    .src__ms { font-size: 11.5px; color: var(--muted); flex: 0 0 auto; }
    .srcsum { margin: 0 0 10px; font-size: 13px; }
    #srcRefresh { margin-left: 10px; vertical-align: middle; font-weight: 400; }
    @media (max-width: 560px) {
        .src { flex-wrap: wrap; gap: 6px 10px; }
        .src__note { flex-basis: 100%; }
    }

    /* Списки пользователей/регистраций — карточки-строки вместо таблиц:
       читаются на любой ширине без горизонтального скролла. */
    .ulist { display: flex; flex-direction: column; gap: 8px; }
    .urow { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
    .urow__mail { font-size: 13.5px; font-weight: 600; word-break: break-all; }
    .urow__meta { margin-top: 3px; color: var(--muted); font-size: 12px; display: flex; gap: 6px 14px; flex-wrap: wrap; }
    .urow__meta b { color: var(--text); font-weight: 600; }

    .btn {
        display: inline-block; text-decoration: none;
        background: var(--card2); color: var(--text); border: 1px solid var(--border);
        padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .btn:hover { border-color: var(--accent); }
    .btn--primary { background: var(--accent); border-color: var(--accent); color: #0f1115; font-weight: 600; }
    .btn--danger { color: var(--bad); }
    .btn--small { padding: 4px 10px; font-size: 12px; }


    /* Ворота ключа: инлайн-поле вместо window.prompt (в PWA prompt ненадёжен). */
    .key-gate { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(10, 12, 16, 0.94); padding: 20px; }
    .key-gate[hidden] { display: none; }
    .key-gate__box { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
    .key-gate__title { font-size: 18px; font-weight: 700; }
    .key-gate__hint { color: var(--muted); font-size: 13px; margin-top: -8px; }
    /* 16px, чтобы iOS не зумил при фокусе. autocapitalize=off — без заглавной. */
    .key-gate__input { width: 100%; padding: 12px 14px; font-size: 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--card2); color: var(--text); }
    .key-gate__input:focus { outline: none; border-color: var(--accent); }
    .key-gate__btn { padding: 12px; font-size: 15px; font-weight: 600; border: none; border-radius: 10px; background: var(--accent); color: #0f1115; cursor: pointer; }
    .key-gate__err { color: var(--bad); font-size: 13px; }

    /* ---------- Пульс (обзор) ---------- */
    .p-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--faint); }
    .p-dot--ok { background: var(--ok); } .p-dot--warn { background: var(--warn); } .p-dot--bad { background: var(--bad); }
    .p-live { position: relative; }
    .p-live::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--ok);
        opacity: .5; animation: p-ping 2s ease-out infinite; }
    @keyframes p-ping { from { transform: scale(.6); opacity: .6; } to { transform: scale(1.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .p-live::after { animation: none; } }
    .p-hero { background: linear-gradient(160deg, #1b2233 0%, var(--card) 70%); border: 1px solid var(--border);
        border-radius: 20px; padding: 18px 18px 12px; }
    .p-hero__top { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
    .p-hero__n { font-size: 56px; font-weight: 700; line-height: 1; margin: 10px 0 4px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .p-hero__sub { color: var(--muted); font-size: 13px; }
    .p-who { margin-top: 12px; }
    .p-who div { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; padding: 8px 0;
        border-top: 1px solid rgba(255,255,255,.05); }
    .p-who b { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .p-who span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
    .p-sys { margin: 12px 0 18px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); }
    .p-sys.is-warn { border-color: rgba(242,193,78,.35); background: rgba(242,193,78,.05); }
    .p-sys.is-bad { border-color: rgba(255,118,118,.4); background: rgba(255,118,118,.06); }
    .p-status { display: flex; align-items: center; gap: 10px; padding: 13px 16px; font-size: 14px; cursor: pointer; list-style: none; }
    .p-status::-webkit-details-marker { display: none; }
    .p-status small { margin-left: auto; color: var(--muted); white-space: nowrap; }
    .p-sys[open] .p-status small { color: var(--accent); }
    .p-sys__body { padding: 0 12px 12px; }
    .p-sys__h { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint);
        margin: 14px 4px 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .p-sys__h span { text-transform: none; letter-spacing: 0; }
    .p-sys__h .btn { margin-left: auto; }
    .p-sys__p { font-size: 13px; color: var(--muted); margin: 0 4px; }
    .p-sys .srcgrp { margin-bottom: 8px; }
    .p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 22px; }
    .p-tile { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; min-width: 0; }
    .p-tile__l { color: var(--muted); font-size: 12px; }
    .p-tile__v { font-size: 26px; font-weight: 650; margin-top: 2px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .p-tile__d { font-size: 12px; color: var(--muted); }
    .p-tile__d.up { color: var(--ok); }
    .p-tile svg { display: block; width: 100%; height: 26px; margin-top: 6px; }
    .p-h2 { font-size: 13px; color: var(--muted); font-weight: 500; margin: 0 0 8px 2px; }
    .p-list { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .p-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--border); }
    .p-row:first-child { border-top: 0; }
    .p-av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 600;
        font-size: 13px; color: #0d0f14; flex: none; text-transform: uppercase; }
    .p-row__m { flex: 1; min-width: 0; }
    .p-row__m b { display: block; font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .p-row__m span { color: var(--muted); font-size: 12.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .p-row__r { color: var(--faint); font-size: 12px; white-space: nowrap; }
    .p-foot { margin-top: 22px; color: var(--faint); font-size: 12px; text-align: center; }
    .p-foot button { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; cursor: pointer; padding: 6px 2px; }

    /* ---------- Телефон ---------- */
    @media (max-width: 640px) {
        body { padding: 14px 10px 40px; }
        h1 { font-size: 18px; }
        .tabs { gap: 6px; margin-bottom: 14px; }
        .tabs button { padding: 7px 12px; flex: 1 1 auto; }
        .cards { grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 18px; }
        .card { padding: 12px; }
        .card .value { font-size: 22px; }
        .section-title { margin: 18px 0 10px; }
        /* Ячейки переносятся — таблицы влезают в экран без бокового скролла
           (.tblwrap остаётся страховкой на совсем узких экранах). */
        th, td { padding: 8px 10px; font-size: 12px; }
        /* Вкладки прилипают к верху: длинный обзор листается, а переключиться
           можно не возвращаясь наверх. */
        .tabs { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 8px 0; margin: -8px 0 12px; }
        .tabs button { padding: 10px 8px; font-size: 14px; }
        /* Кнопки «колоды/слова» — под палец, а не 20px-таблетки. */
        .udecks-btn { padding: 7px 12px; font-size: 12.5px; }
        .urow__meta { gap: 6px 12px; align-items: center; }
        #srcRefresh { padding: 7px 12px; }
    }
    .udecks-btn { padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px; background: none;
        color: var(--muted); font-size: 11px; cursor: pointer; font-family: inherit; }
    .udecks-btn:hover { color: var(--fg); }
    .udecks { margin-top: 8px; padding-left: 2px; }
    .udecks__sum { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .udeck { margin-bottom: 10px; }
    .udeck__head { font-size: 12px; margin-bottom: 3px; }
    .udeck__list { margin: 0; padding-left: 18px; font-size: 12px; color: var(--muted); }
    .udeck__list li { margin: 1px 0; }
    .udeck__kana { opacity: 0.7; }
    .udeck__rep { color: var(--accent); }
    .uwords { margin-top: 8px; padding-left: 2px; }
    .uwords__q { width: 100%; max-width: 320px; margin-bottom: 6px; padding: 4px 8px; font: inherit;
        font-size: 12px; color: var(--fg); background: none; border: 1px solid var(--line); border-radius: 8px; }
    .uwords__ul { margin: 0 0 6px; padding-left: 18px; font-size: 12px; }
    .uwords__ul li { margin: 4px 0; }
    .uword__sent { color: var(--muted); }
    .uword__meta { font-size: 11px; color: var(--muted); opacity: 0.8; }
</style>
</head>
<body>
<div class="wrap">
    <h1>Animei <span class="h1-sub" id="sub"></span></h1>

    <div class="tabs">
        <button data-tab="overview" class="active">Обзор</button>
        <button data-tab="stats">Статистика</button>
        <button data-tab="users">Пользователи</button>
    </div>

    <div class="tab active" id="tab-overview">
        <!-- Пульс: кто сейчас на сайте → одна строка про систему → 4 цифры → люди.
             Всё техническое спрятано за строкой статуса. -->
        <div class="p-hero">
            <div class="p-hero__top"><span class="p-dot p-dot--ok p-live"></span> Сейчас на сайте</div>
            <div class="p-hero__n" id="pOnlineN">—</div>
            <div class="p-hero__sub" id="pOnlineSub">&nbsp;</div>
            <div class="p-who" id="pOnlineWho"></div>
        </div>

        <details class="p-sys" id="pSys">
            <summary class="p-status" id="pStatus"><span class="p-dot"></span><span>Проверяем систему…</span><small>система ›</small></summary>
            <div class="p-sys__body">
                <div class="p-sys__h">Сервер и база <span id="ovHealthSum"></span></div>
                <div id="ovHealth" class="msg">Загрузка…</div>
                <div class="p-sys__h">Источники <span id="ovSourcesSum"></span>
                    <button class="btn btn--small" id="srcRefresh" type="button">проверить</button></div>
                <div id="ovSources" class="msg">Загрузка…</div>
                <div class="p-sys__h">Синхронизация субтитров <span id="ovSyncSum"></span></div>
                <div id="ovSync" class="msg">Загрузка…</div>
                <div class="p-sys__h">Материалы</div>
                <p class="p-sys__p"><a href="https://animei.space/promo-vert-bf6b634a/" target="_blank" rel="noopener">🎬 Промо-ролики</a>
                    — 6 сцен: вертикаль и ПК 16:9, RU/UA/EN</p>
            </div>
        </details>

        <div class="p-grid" id="pTiles"></div>

        <h2 class="p-h2">Люди</h2>
        <div class="p-list" id="pPeople"><div class="msg">Загрузка…</div></div>

        <div class="p-foot" id="ownerDev"></div>
    </div>

    <div class="tab" id="tab-stats">
        <div id="statsRoot"></div>
    </div>

    <div class="tab" id="tab-users">
        <div id="usersList" class="msg">Загрузка…</div>
    </div>
</div>

<div id="keyGate" class="key-gate" hidden>
    <form class="key-gate__box" id="keyForm">
        <div class="key-gate__title">🔑 Вход в админку</div>
        <div class="key-gate__hint">Введите ключ владельца</div>
        <input id="keyInput" class="key-gate__input" type="text" inputmode="text"
               autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false"
               placeholder="ключ">
        <button type="submit" class="key-gate__btn">Войти</button>
        <div class="key-gate__err" id="keyErr" hidden>Неверный ключ — попробуй ещё раз</div>
    </form>
</div>

<script src="../js/stats-view.js"></script>
<script>
    // Тот же хост, что и приложение (nginx проксирует /api на бэкенд).
    var apiBase = ['localhost', '127.0.0.1', ''].includes(location.hostname)
        ? 'http://localhost:3005'
        : location.origin;

    // Тот же лёгкий ключ владельца, что у stats.html: ?key=… один раз в адресе —
    // дальше живёт в localStorage (общий слот animei:statsKey).
    var urlKey = new URLSearchParams(location.search).get('key');
    if (urlKey) { try { localStorage.setItem('animei:statsKey', urlKey); } catch (e) {} }
    var adminKey = urlKey || (function () { try { return localStorage.getItem('animei:statsKey') || ''; } catch (e) { return ''; } })();
    function keyQ() { return 'key=' + encodeURIComponent(adminKey); }

    // Если владелец вошёл в приложение как админ (admin@animei.space) — админка
    // пускает по его сессии, ключ не нужен. Шлём Bearer-токен приложения; сервер
    // принимает либо ключ, либо токен админа из allowlist.
    function authHeaders(extra) {
        var h = extra || {};
        try {
            var t = localStorage.getItem('animei:accessToken');
            if (t) h.Authorization = 'Bearer ' + t;
        } catch (e) {}
        return h;
    }

    // Ключ спрашиваем инлайн-полем, а не window.prompt: в установленном PWA
    // prompt() ненадёжен (местами не показывается вовсе). Поле с
    // autocapitalize=off не подставляет заглавную, из-за которой ключ «не работал».
    function showKeyGate(wrong) {
        var gate = document.getElementById('keyGate');
        var wasHidden = gate.hidden;
        gate.hidden = false;
        if (wrong) document.getElementById('keyErr').hidden = false;
        if (wasHidden) {
            var i = document.getElementById('keyInput');
            i.value = '';
            i.focus();
        }
    }
    function requireKey(r) {
        if (r.status !== 403) return r.json();
        // Был сохранённый ключ, но сервер его отклонил → это неверный ключ.
        showKeyGate(!!adminKey);
        throw new Error('403');
    }
    document.getElementById('keyForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var k = document.getElementById('keyInput').value.trim();
        if (!k) return;
        try { localStorage.setItem('animei:statsKey', k); } catch (e2) {}
        location.reload();
    });

    function api(path) {
        var sep = path.includes('?') ? '&' : '?';
        return fetch(apiBase + '/api/v1/admin' + path + sep + keyQ(), { headers: authHeaders() }).then(requireKey);
    }

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
    }
    function fmt(n) { return (n || 0).toLocaleString('ru-RU'); }
    // Таблица в скролл-обёртке — широкие таблицы на телефоне скроллятся сами.
    function tbl(inner) { return '<div class="tblwrap"><table>' + inner + '</table></div>'; }
    function dt(s) { return s ? new Date(s).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—'; }

    // ---------- Вкладки ----------
    var loaded = {};
    document.querySelectorAll('.tabs button').forEach(function (b) {
        b.addEventListener('click', function () {
            document.querySelectorAll('.tabs button').forEach(function (x) { x.classList.remove('active'); });
            document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
            b.classList.add('active');
            document.getElementById('tab-' + b.dataset.tab).classList.add('active');
            openTab(b.dataset.tab);
        });
    });

    function openTab(name) {
        if (loaded[name]) return;
        loaded[name] = true;
        if (name === 'users') loadUsers();
        // Статистика встроена прямо здесь (без отдельной страницы/iframe): виджет
        // из stats-view.js монтируется в контейнер, использует ту же сессию/ключ.
        if (name === 'stats' && window.StatsView) StatsView.mount(document.getElementById('statsRoot'));
    }

    // ---------- Обзор ----------
    function loadOverview() {
        api('/overview').then(function (d) {
            // Доступ подтверждён — значит, это владелец: метим устройство.
            if (!loaded.ownerMarked) { loaded.ownerMarked = true; markOwnerDevice(); renderOwnerDev(); }
            document.getElementById('sub').textContent = 'обновлено ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

            var h = d.health;

            if (h) {
                var rows = Object.keys(h.checks || {}).map(function (k) {
                    var v = h.checks[k];
                    var ok = v === 'ok';
                    return '<tr><td>' + esc(k) + '</td><td style="color:var(--' + (ok ? 'ok' : 'bad') + ')">' + esc(v) + '</td></tr>';
                }).join('');
                var bk = h.backupAgeHours >= 0 ? h.backupAgeHours + ' ч назад' : 'нет!';
                var bad = Object.keys(h.checks || {}).filter(function (k) { return h.checks[k] !== 'ok'; });
                foldSum('Health', bad.length ? 'сбой: ' + bad.join(', ') : 'всё ок · бэкап ' + bk, !bad.length,
                    'сбой сервера: ' + bad.join(', '));
                document.getElementById('ovHealth').outerHTML =
                    tbl('<tr><th>Проверка</th><th>Статус</th></tr>' + rows +
                    '<tr><td>Бэкап БД</td><td>' + esc(bk) + '</td></tr>' +
                    '<tr><td>Проверено</td><td>' + dt(h.at) + '</td></tr>');
            } else {
                document.getElementById('ovHealth').textContent = 'health-status.json ещё не создан (cron не отработал)';
                foldSum('Health', 'нет данных', false, 'нет данных о здоровье сервера');
            }

            renderSync(d.sync);

        }).catch(function () {});
    }
    // ---------- Сейчас на сайте ----------
    // Живые вкладки: клиент пингует раз в минуту, сервер помнит последние 2.5 мин.
    var ONLINE_PAGES = {
        'app/index': 'главная', 'app/catalog': 'каталог', 'app/player': 'плеер', 'app/watch': 'свой файл',
        'app/words': 'словарь', 'app/study': 'повторение', 'app/deck-study': 'колода', 'app/custom-study': 'своя учёба',
        'app/beginner': 'для новичка', 'app/progress': 'прогресс', 'app/settings': 'настройки',
        'app/login': 'вход', 'app/feedback': 'отзыв', 'landing/index': 'лендинг'
    };
    function pageName(p) { return ONLINE_PAGES[p] || p; }
    function devShort(ua) {
        if (!ua) return '';
        var os = /iPhone|iPad/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows'
            : /Mac OS X/.test(ua) ? 'macOS' : /Linux/.test(ua) ? 'Linux' : '';
        return (/Mobile|iPhone|Android/.test(ua) ? '📱 ' : '🖥 ') + os;
    }
    function plural(n, one, few, many) {
        var m10 = n % 10, m100 = n % 100;
        if (m10 === 1 && m100 !== 11) return one;
        if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
        return many;
    }
    function shortMail(e) { return String(e || '').split('@')[0]; }
    function devName(ua) {
        return /iPhone/.test(ua || '') ? 'iPhone' : /iPad/.test(ua || '') ? 'iPad' : /Android/.test(ua || '') ? 'Android'
            : /Windows/.test(ua || '') ? 'Windows' : /Mac OS X/.test(ua || '') ? 'Mac' : /Linux/.test(ua || '') ? 'Linux' : 'устройство';
    }
    var WHERE = { 'app/player': 'в плеере', 'landing/index': 'на лендинге', 'app/index': 'на главной',
        'app/catalog': 'в каталоге', 'app/words': 'в словаре', 'app/study': 'в повторении', 'app/deck-study': 'в колоде',
        'app/beginner': 'в разделе новичка', 'app/progress': 'в прогрессе', 'app/settings': 'в настройках', 'app/login': 'на входе' };
    function loadOnline() {
        fetch(apiBase + '/api/v1/stats/online?' + keyQ(), { headers: authHeaders() }).then(requireKey).then(function (d) {
            document.getElementById('pOnlineN').textContent = d.count;
            var pages = Object.keys(d.byPage).sort(function (a, b) { return d.byPage[b] - d.byPage[a]; });
            document.getElementById('pOnlineSub').textContent = d.count
                ? pages.map(function (p) { return d.byPage[p] + ' ' + (WHERE[p] || 'на «' + pageName(p) + '»'); }).join(' · ')
                : 'никого, кроме тебя';
            document.getElementById('pOnlineWho').innerHTML = d.people.slice(0, 8).map(function (u) {
                var name = u.email ? shortMail(u.email) : 'гость · ' + devName(u.ua);
                var where = u.title ? u.title : pageName(u.page);
                return '<div><b>' + esc(name) + '</b><span>' + esc(where) + '</span></div>';
            }).join('');
        }).catch(function () {});
    }

    // Четыре цифры + люди — из /stats/pulse (тот же фильтр ботов и своих).
    function spark(arr) {
        var max = Math.max.apply(null, arr.concat([1])), n = arr.length - 1 || 1;
        var pts = arr.map(function (v, i) { return (i * 100 / n).toFixed(1) + ',' + (23 - v / max * 20).toFixed(1); }).join(' ');
        return '<svg viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="#8aa4ff" stroke-width="2" vector-effect="non-scaling-stroke" points="' + pts + '"/></svg>';
    }
    function tile(label, value, delta, up, sp) {
        return '<div class="p-tile"><div class="p-tile__l">' + label + '</div><div class="p-tile__v">' + value + '</div>' +
            '<div class="p-tile__d' + (up ? ' up' : '') + '">' + delta + '</div>' + (sp || '') + '</div>';
    }
    function ago(iso) {
        var m = (Date.now() - new Date(iso)) / 60000;
        if (m < 10) return 'сейчас';
        if (m < 60) return Math.round(m) + ' мин';
        var d0 = new Date(); d0.setHours(0, 0, 0, 0);
        var t = new Date(iso);
        if (t >= d0) return t.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        if (t >= d0 - 86400000) return 'вчера';
        return t.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
    }
    var AV_COLORS = ['#8aa4ff', '#f2c14e', '#5fd08a', '#ff9f7a', '#c79bff', '#6fd3e0'];
    function loadPulse() {
        fetch(apiBase + '/api/v1/stats/pulse?' + keyQ(), { headers: authHeaders() }).then(requireKey).then(function (d) {
            var dd = d.today - d.yesterday;
            var wk = d.prevWeek ? Math.round((d.week - d.prevWeek) / d.prevWeek * 100) : null;
            document.getElementById('pTiles').innerHTML =
                tile('Люди сегодня', fmt(d.today), (dd > 0 ? '↑ ' + dd : dd < 0 ? '↓ ' + (-dd) : '=') + ' к вчера', dd > 0, spark(d.spark)) +
                tile('За 7 дней', fmt(d.week), wk == null ? 'прошлых 7 дней нет' : (wk > 0 ? '↑ ' : wk < 0 ? '↓ ' : '') + Math.abs(wk) + '% к прошлым 7', wk > 0) +
                tile('Что-то сделали', fmt(d.activeWeek), 'за 7 дней · смотрели, сохраняли, учили', false) +
                tile('Аккаунтов', fmt(d.accountsTotal), (d.accountsNewWeek ? '+' + d.accountsNewWeek : '+0') + ' за неделю', d.accountsNewWeek > 0);
            var el = document.getElementById('pPeople');
            if (!d.accounts.length) { el.innerHTML = '<div class="msg">Пока никого</div>'; return; }
            el.innerHTML = d.accounts.map(function (u, i) {
                var sub = fmt(u.words) + ' ' + plural(u.words, 'слово', 'слова', 'слов') + (u.lastTitle ? ' · ' + u.lastTitle : '');
                return '<div class="p-row"><div class="p-av" style="background:' + AV_COLORS[i % AV_COLORS.length] + '">' +
                    esc(String(u.email || '?').charAt(0)) + '</div>' +
                    '<div class="p-row__m"><b>' + esc(u.email) + '</b><span>' + esc(sub) + '</span></div>' +
                    '<div class="p-row__r">' + esc(ago(u.lastSeen)) + '</div></div>';
            }).join('');
        }).catch(function () {});
    }

    // Пока открыт «Обзор» и вкладка на виду — онлайн раз в 30 с, цифры раз в 5 мин.
    var pulseTick = 0;
    setInterval(function () {
        var tab = document.getElementById('tab-overview');
        if (document.visibilityState === 'visible' && tab && tab.classList.contains('active')) loadOnline();
        if (document.visibilityState === 'visible' && tab && tab.classList.contains('active') && ++pulseTick % 10 === 0) loadPulse();
    }, 30000);

    // ---------- Синхронизация субтитров (ночной прогон scripts/sync-health.mjs) ----------
    var SYNC_LABEL = { ok: 'ОК', suspicious: 'подозрительно', desync: 'РАССИНХРОН', fail: 'сбой', 'no-data': 'нет данных' };
    var SYNC_CLS = { ok: 'ok', suspicious: 'off', desync: 'bad', fail: 'bad', 'no-data': 'off' };
    function renderSync(sy) {
        var el = document.getElementById('ovSync');
        if (!sy) { el.textContent = 'sync-health.json ещё не создан (ночной прогон не отработал)'; foldSum('Sync', 'нет данных', true); return; }
        var s = sy.summary || {};
        foldSum('Sync', (sy.overall === 'ok' ? 'всё синхронно' : sy.overall === 'warn' ? 'есть подозрительные' : 'есть рассинхрон') +
            ' · ок ' + fmt(s.ok) + '/' + fmt(s.total), sy.overall === 'ok' || sy.overall === 'warn',
            'рассинхрон субтитров: ок ' + fmt(s.ok) + ' из ' + fmt(s.total));
        var col = sy.overall === 'ok' ? 'ok' : (sy.overall === 'warn' ? 'muted' : 'bad');
        var head = '<p class="srcsum"><b style="color:var(--' + col + ')">' +
            (sy.overall === 'ok' ? 'Всё синхронно' : sy.overall === 'warn' ? 'Есть подозрительные' : 'Есть рассинхрон') +
            '</b> — ок ' + fmt(s.ok) + ' из ' + fmt(s.total) +
            (s.suspicious ? ', подозрительно ' + s.suspicious : '') +
            (s.desync ? ', рассинхрон ' + s.desync : '') +
            (s.fail ? ', сбой ' + s.fail : '') +
            ' <span style="color:var(--muted)">· проверено ' + dt(sy.at) + ', ' + fmt(sy.durationSec) + ' с</span></p>';
        var rows = (sy.results || []).map(function (r) {
            var v = r.verdict || 'no-data';
            var note = r.fail ? r.fail
                : ('sim ' + (r.bestSim == null ? '—' : r.bestSim) + ' · сдвиг ' + (r.align ? r.align.offset : '—') +
                   (r.align && r.align.method ? ' (' + r.align.method + ', c=' + r.align.confidence + ')' : '') +
                   ' → применён ' + r.applied + ' · ' + (r.track || ''));
            return '<div class="src"><span class="src__dot src__dot--' + (SYNC_CLS[v] || 'off') + '"></span>' +
                '<span class="src__name">' + esc(r.name + ' ep' + r.ep + ' · ' + r.uiLang) + '</span>' +
                '<span class="src__note' + (v === 'desync' || v === 'fail' ? ' src__note--bad' : '') + '">' + esc(SYNC_LABEL[v] || v) +
                '<span class="src__hint">' + esc(note) + (r.file ? ' · ' + esc(r.file) : '') + '</span></span>' +
                '<span class="src__ms">' + fmt(r.sec) + ' с</span></div>';
        }).join('');
        var hist = (sy.history || []).map(function (h) {
            var c = h.overall === 'ok' ? 'ok' : (h.overall === 'warn' ? 'off' : 'bad');
            return '<span class="src__dot src__dot--' + c + '" title="' + esc(dt(h.at) + ': ок ' + h.ok + '/' + h.total) + '" style="display:inline-block;margin-right:4px"></span>';
        }).join('');
        el.className = '';
        el.innerHTML = head + '<div class="srcgrp"><div class="srcgrp__head">Последний прогон</div>' + rows + '</div>' +
            (hist ? '<p class="srcsum" style="color:var(--muted)">История прогонов (новые слева): ' + hist + '</p>' : '');
    }

    // ---------- Источники ----------
    var SRC_GROUPS = [
        ['video', 'Видео'],
        ['subs', 'Субтитры'],
        ['catalog', 'Каталог'],
        ['tools', 'Инструменты'],
    ];

    function srcHtml(it) {
        // ok === null — источник выключен намеренно (нет ключа), это не поломка.
        var cls = it.ok === null ? 'off' : (it.ok ? 'ok' : 'bad');
        return '<div class="src">' +
            '<span class="src__dot src__dot--' + cls + '"></span>' +
            '<span class="src__name">' + esc(it.title) + '</span>' +
            '<span class="src__note' + (it.ok === false ? ' src__note--bad' : '') + '">' + esc(it.note) +
                (it.hint ? '<span class="src__hint">' + esc(it.hint) + '</span>' : '') + '</span>' +
            '<span class="src__ms">' + fmt(it.ms) + ' мс</span>' +
        '</div>';
    }

    function renderSources(d) {
        var items = d.items || [];
        var broken = items.filter(function (i) { return i.ok === false; });
        var sum = broken.length
            ? '<b style="color:var(--bad)">Сломано: ' + broken.length + '</b> — ' +
              esc(broken.map(function (i) { return i.title; }).join(', '))
            : '<b style="color:var(--ok)">Все источники живы</b>';

        var groups = SRC_GROUPS.map(function (g) {
            var rows = items.filter(function (i) { return i.kind === g[0]; });
            if (!rows.length) return '';
            return '<div class="srcgrp"><div class="srcgrp__head">' + g[1] + '</div>' +
                rows.map(srcHtml).join('') + '</div>';
        }).join('');

        var names = broken.map(function (i) { return i.title; }).join(', ');
        foldSum('Sources', broken.length ? 'сломано: ' + names : 'все живы', !broken.length,
            names + (broken.length === 1 ? ' не отвечает' : ' не отвечают'));
        document.getElementById('ovSources').className = '';
        document.getElementById('ovSources').innerHTML =
            '<p class="srcsum">' + sum + ' <span style="color:var(--muted)">· проверено ' + dt(d.checkedAt) +
            (d.cached ? ' (из кэша)' : '') + '</span></p>' + groups;
    }

    function loadSources(force) {
        var el = document.getElementById('ovSources');
        el.className = 'msg';
        el.textContent = 'Проверяем источники…';
        api('/sources' + (force ? '?force=1' : '')).then(renderSources).catch(function () {
            el.textContent = 'Не удалось проверить источники';
        });
    }

    document.getElementById('srcRefresh').addEventListener('click', function () { loadSources(true); });

    // Строка статуса: три подсистемы сводятся в одну фразу. Всё ок — зелёная
    // «Всё работает»; иначе — ЧТО именно сломалось, и панель раскрыта.
    var sysState = {};
    function foldSum(name, text, ok, problem) {
        var sum = document.getElementById('ov' + name + 'Sum');
        if (sum) { sum.textContent = '· ' + text; sum.style.color = ok ? 'var(--muted)' : 'var(--bad)'; }
        sysState[name] = { ok: ok, problem: problem || text };
        renderStatus();
    }
    function renderStatus() {
        var names = ['Health', 'Sources', 'Sync'];
        var known = names.filter(function (n) { return sysState[n]; });
        var bad = known.filter(function (n) { return !sysState[n].ok; });
        var st = document.getElementById('pStatus'), box = document.getElementById('pSys');
        var dot = bad.length ? (sysState.Health && !sysState.Health.ok ? 'bad' : 'warn') : (known.length === names.length ? 'ok' : '');
        var text = bad.length ? bad.map(function (n) { return sysState[n].problem; }).join(' · ')
            : known.length === names.length ? 'Всё работает' : 'Проверяем систему…';
        st.innerHTML = '<span class="p-dot' + (dot ? ' p-dot--' + dot : '') + '"></span><span>' + esc(text) + '</span><small>система ›</small>';
        box.classList.toggle('is-warn', dot === 'warn');
        box.classList.toggle('is-bad', dot === 'bad');
    }

    // ---------- «Это моё устройство» ----------
    // Владелец заходит с ПК и телефона, а мобильный Киевстар меняет IP на
    // каждом заходе — по IP себя не отфильтровать. Помечаем УСТРОЙСТВО: флаг
    // в localStorage (общий для лендинга и приложения — один origin), после
    // него трекер молчит, а событие 'owner' убирает из статистики и всю прошлую
    // историю устройства. Кто открыл админку с доступом — тот владелец, поэтому
    // метим сразу, без вопросов; снять можно кнопкой.
    function markOwnerDevice() {
        var vid = null;
        try {
            vid = localStorage.getItem('animei:visitorId');
            if (localStorage.getItem('animei:owner') === '1') return;
            localStorage.setItem('animei:owner', '1');
        } catch (e) { return; }
        if (vid) fetch(apiBase + '/api/v1/stats/hit', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ event: 'owner', page: 'marked', visitorId: vid }), keepalive: true
        }).catch(function () {});
    }
    function renderOwnerDev() {
        var on = false;
        try { on = localStorage.getItem('animei:owner') === '1'; } catch (e) {}
        var el = document.getElementById('ownerDev');
        el.innerHTML = on
            ? '📵 это устройство не считается · <button type="button" id="ownerToggle">считать</button>'
            : 'это устройство считается в статистике · <button type="button" id="ownerToggle">не считать</button>';
        document.getElementById('ownerToggle').addEventListener('click', function () {
            if (on) { try { localStorage.removeItem('animei:owner'); } catch (e) {} }
            else markOwnerDevice();
            renderOwnerDev();
        });
    }

    function cardHtml(label, value) {
        return '<div class="card"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>';
    }

    // ---------- Пользователи ----------
    function loadUsers() {
        api('/users').then(function (r) {
            var el = document.getElementById('usersList');
            if (!r.data.length) { el.textContent = 'Пользователей нет'; return; }
            el.className = '';
            el.innerHTML = '<div class="ulist">' + r.data.map(function (u) {
                var mark = u.isSeed ? ' <span style="color:var(--accent)">· seed</span>' : '';
                return '<div class="urow" data-uid="' + esc(u.id) + '"><div class="urow__mail">' + esc(u.email) + mark + '</div>' +
                    '<div class="urow__meta">' +
                    '<span>рег. ' + dt(u.createdAt) + '</span>' +
                    '<span>был ' + dt(u.lastSeen) + '</span>' +
                    '<span>слов <b>' + fmt(u.words) + '</b></span>' +
                    '<span>повторял <b>' + fmt(u.reviewedWords) + '</b></span>' +
                    '<button class="udecks-btn" data-uid="' + esc(u.id) + '">колоды</button>' +
                    '<button class="udecks-btn uwords-btn" data-uid="' + esc(u.id) + '">слова</button>' +
                    '</div><div class="udecks" hidden></div><div class="uwords" hidden></div></div>';
            }).join('') + '</div>';
            el.querySelectorAll('.udecks-btn').forEach(function (btn) {
                var open = btn.classList.contains('uwords-btn') ? toggleWords : toggleDecks;
                btn.addEventListener('click', function () { open(btn); });
            });
        }).catch(function () {});
    }

    // Колоды пользователя: только чтение, разворачиваются прямо в строке.
    // Грузим по первому нажатию и запоминаем — повторное нажатие просто прячет.
    function toggleDecks(btn) {
        var row = btn.closest('.urow');
        var box = row.querySelector('.udecks');
        if (!box.hidden) { box.hidden = true; btn.textContent = 'колоды'; return; }
        box.hidden = false;
        btn.textContent = 'скрыть';
        if (box.dataset.loaded) return;
        box.innerHTML = '<div class="msg">Загрузка…</div>';
        api('/users/' + encodeURIComponent(btn.dataset.uid) + '/decks').then(function (r) {
            var d = r.data;
            box.dataset.loaded = '1';
            if (!d.decks.length) {
                box.innerHTML = '<div class="msg">Колод нет · слов всего ' + fmt(d.totalWords) + '</div>';
                return;
            }
            box.innerHTML = '<div class="udecks__sum">слов всего <b>' + fmt(d.totalWords) +
                '</b> · вне колод <b>' + fmt(d.looseWords) + '</b></div>' +
                d.decks.map(function (deck) {
                    var words = deck.words.map(function (w) {
                        var rep = w.srsReps ? ' <span class="udeck__rep">×' + w.srsReps + '</span>' : '';
                        return '<li><b>' + esc(w.kanji) + '</b> <span class="udeck__kana">' + esc(w.kana) + '</span> — ' +
                            esc(w.translation) + rep + '</li>';
                    }).join('');
                    return '<div class="udeck"><div class="udeck__head">' + esc(deck.emoji || '📦') + ' <b>' +
                        esc(deck.name) + '</b> · ' + fmt(deck.words.length) + ' сл. · изм. ' + dt(deck.updatedAt) +
                        '</div><ul class="udeck__list">' + words + '</ul></div>';
                }).join('');
        }).catch(function () { box.innerHTML = '<div class="msg">Не удалось загрузить</div>'; });
    }

    // Все сохранённые слова пользователя — без привязки к колодам (слово может
    // лежать вне колод и в списке колод его не видно). Только чтение.
    // Грузим первую сотню, дальше — «показать ещё»; поиск уходит на сервер,
    // чтобы не тянуть весь пул ради одной карточки.
    function toggleWords(btn) {
        var row = btn.closest('.urow');
        var box = row.querySelector('.uwords');
        if (!box.hidden) { box.hidden = true; btn.textContent = 'слова'; return; }
        box.hidden = false;
        btn.textContent = 'скрыть слова';
        if (box.dataset.loaded) return;
        box.dataset.loaded = '1';
        box.innerHTML = '<input class="uwords__q" type="search" placeholder="поиск по слову, чтению, переводу">' +
            '<div class="uwords__list"><div class="msg">Загрузка…</div></div>';
        var input = box.querySelector('.uwords__q');
        var timer = 0;
        input.addEventListener('input', function () {
            clearTimeout(timer);
            timer = setTimeout(function () { loadWords(box, btn.dataset.uid, 0, input.value.trim()); }, 300);
        });
        loadWords(box, btn.dataset.uid, 0, '');
    }

    // offset = 0 — новая выборка, иначе дописываем страницу к уже показанному.
    function loadWords(box, uid, offset, q) {
        var list = box.querySelector('.uwords__list');
        if (!offset) list.innerHTML = '<div class="msg">Загрузка…</div>';
        api('/users/' + encodeURIComponent(uid) + '/words?limit=100&offset=' + offset +
            (q ? '&q=' + encodeURIComponent(q) : '')).then(function (r) {
            box._items = offset ? (box._items || []).concat(r.data.words) : r.data.words;
            box._q = q;
            renderWords(box, uid, r.data.total);
        }).catch(function () { list.innerHTML = '<div class="msg">Не удалось загрузить</div>'; });
    }

    function renderWords(box, uid, total) {
        var items = box._items || [];
        var rows = items.map(function (w) {
            var decks = w.decks.map(function (d) { return esc((d.emoji || '📦') + ' ' + d.name); }).join(', ') || 'вне колод';
            var meta = decks + (w.srsReps ? ' · повторов ' + w.srsReps : '') +
                (w.srsDue ? ' · след. ' + esc(w.srsDue) : '') + (w.hasClip ? ' · клип' : '') +
                ' · ' + dt(w.createdAt);
            return '<li><b>' + esc(w.kanji) + '</b> <span class="udeck__kana">' + esc(w.kana) + '</span> — ' +
                esc(w.translation) +
                (w.sentence ? '<div class="uword__sent">' + esc(w.sentence) + '</div>' : '') +
                '<div class="uword__meta">' + meta + '</div></li>';
        }).join('');
        var head = '<div class="udecks__sum">' + (box._q ? 'найдено ' : 'слов всего ') + '<b>' + fmt(total) +
            '</b> · показано ' + fmt(items.length) + '</div>';
        var more = items.length < total ? '<button class="udecks-btn uwords__more">показать ещё</button>' : '';
        box.querySelector('.uwords__list').innerHTML = head +
            (rows ? '<ul class="uwords__ul">' + rows + '</ul>' : '<div class="msg">Ничего не найдено</div>') + more;
        var moreBtn = box.querySelector('.uwords__more');
        if (moreBtn) moreBtn.addEventListener('click', function () {
            moreBtn.textContent = 'загружаю…';
            loadWords(box, uid, items.length, box._q);
        });
    }

    loadOverview();
    loadOnline();
    loadPulse();
    renderOwnerDev();
    loadSources(false);
</script>
</body>
</html>
