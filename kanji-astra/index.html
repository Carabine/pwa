<!doctype html>
<html lang="ru" class="ka-root">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="description" content="Учитесь писать кандзи из своих слов Animei: обводка, письмо по памяти и повторения.">
    <title>Прописи · Animei</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <script>
        // Ранняя тема исключает вспышку тёмного фона у светлой тетради.
        (function () {
            var th = 'dark';
            try { var s = JSON.parse(localStorage.getItem('animei:settings') || '{}'); if (s && s.theme) th = s.theme; } catch (e) {}
            if (th === 'system') th = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            th = th === 'light' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', th);
            document.querySelector('meta[name="theme-color"]').content = th === 'light' ? '#f4f5fa' : '#0a0a0f';
        })();
    </script>
    <!-- На проде css/app/ не существует (сборка склеивает модули в один app.css) -->
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="./style.css">
    <script>
        // Порядок паков совпадает с deck-study: пакет должен появиться раньше общего i18n.
        (function () {
            var langs = { ru: 1, uk: 1, en: 1 }, lang = null;
            try { lang = localStorage.getItem('animei:lang'); } catch (e) {}
            if (!langs[lang]) {
                lang = 'ru';
                var prefs = [navigator.language].concat(navigator.languages || []);
                for (var i = 0; i < prefs.length; i++) {
                    var c = String(prefs[i] || '').toLowerCase().split('-')[0];
                    if (langs[c]) { lang = c; break; }
                }
            }
            window.KANJI_LANG = lang;
            if (lang !== 'ru') document.write('<scr' + 'ipt src="../js/i18n/' + lang + '.js" defer></scr' + 'ipt>');
        })();
    </script>
    <script src="../libs/axios/axios.min.js" defer></script>
    <script src="../js/snackbar.js" defer></script>
    <script src="../js/settings.js" defer></script>
    <script src="../js/i18n.js" defer></script>
    <script src="../js/speech.js" defer></script>
    <script src="../js/axiosClient.js" defer></script>
    <script src="../js/video-store.js" defer></script>
    <script src="../js/words-store.js" defer></script>
    <script src="../js/freeze.js" defer></script>
    <script src="../js/decks-store.js" defer></script>
    <script src="./i18n.js" defer></script>
    <script src="./core.js" defer></script>
    <script src="./board.js" defer></script>
    <script src="./app.js" defer></script>
</head>
<body class="ka-body">
    <div class="ka-shell">
        <nav class="ka-nav" aria-label="Animei">
            <a href="../index.html">← Animei</a>
            <a href="../pages/words.html" data-ka="myWords">Мои слова</a>
        </nav>
        <div id="ka-storage" class="ka-notice" role="alert" hidden></div>
        <main id="ka-main" tabindex="-1" aria-busy="true">
            <p class="ka-loading" data-ka="loading">Открываем тетрадь…</p>
        </main>
        <footer class="ka-footer">
            <span data-ka="localOnly">Прогресс хранится в этом браузере</span>
            <span><a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">KanjiVG · Ulrich Apel et al.</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a></span>
            <span id="ka-offline"></span>
        </footer>
    </div>
    <svg id="ka-measure" class="ka-measure" width="109" height="109" viewBox="0 0 109 109" aria-hidden="true"></svg>
    <noscript>Для тренажёра нужен JavaScript. JavaScript is required.</noscript>
</body>
</html>
