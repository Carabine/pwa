<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Animei</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="icon" type="image/png" href="./img/favicon.png">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="./img/icons/180x180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <script>
        // Тему ставим ДО первой отрисовки. js/settings.js подключён с defer и
        // выполняется уже после того, как браузер нарисовал первый кадр, —
        // из-за этого светлая тема на каждой загрузке вспыхивала тёмной.
        // Логика зеркалит effectiveTheme() из js/settings.js.
        (function () {
            var th = 'dark';
            try {
                var s = JSON.parse(localStorage.getItem('animei:settings') || '{}');
                if (s && s.theme) th = s.theme;
            } catch (e) { /* приватный режим */ }
            if (th === 'system') {
                th = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
                    ? 'light' : 'dark';
            }
            th = th === 'light' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', th);
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', th === 'light' ? '#f4f5fa' : '#0a0a0f');
        })();
    </script>
    <link href="./css/app.css" rel="stylesheet">
    <style>
        /* Анимированный сплэш при запуске приложения (поверх нативного «лого на весь
           экран»): пульсирующая иконка あ, имя с градиентом и бегущая полоска. */
        .app-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--bg,#0a0a0f);transition:opacity .45s ease}
        .app-splash.is-hiding{opacity:0;pointer-events:none}
        .app-splash__logo{position:relative;width:100px;height:100px;display:flex;align-items:center;justify-content:center;animation:splash-pop .6s cubic-bezier(.2,.9,.3,1.25) both}
        .app-splash__mark{width:100px;height:100px;border-radius:24%;box-shadow:0 14px 44px -8px rgba(124,140,248,.6);position:relative;z-index:1}
        .app-splash__glow{position:absolute;inset:-32%;border-radius:50%;background:radial-gradient(circle,rgba(124,140,248,.5),transparent 62%);filter:blur(8px);animation:splash-pulse 1.7s ease-in-out infinite}
        .app-splash__name{font-family:'Inter',system-ui,sans-serif;font-size:27px;font-weight:700;letter-spacing:-.5px;background:linear-gradient(135deg,#7c8cf8,#b4bcfb);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;opacity:0;animation:splash-in .5s ease .28s forwards}
        .app-splash__bar{width:128px;height:3px;border-radius:99px;background:rgba(124,140,248,.16);overflow:hidden}
        .app-splash__bar span{display:block;width:38%;height:100%;border-radius:99px;background:linear-gradient(90deg,#7c8cf8,#b4bcfb);animation:splash-slide 1.15s ease-in-out infinite}
        @keyframes splash-pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
        @keyframes splash-pulse{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.18);opacity:.95}}
        @keyframes splash-in{to{opacity:1}}
        @keyframes splash-slide{0%{transform:translateX(-130%)}100%{transform:translateX(360%)}}
        @media (prefers-reduced-motion:reduce){.app-splash__glow,.app-splash__bar span,.app-splash__logo{animation:none}}
        /* На ПК сплэш не нужен — он для запуска на телефоне / в установленном PWA.
           На широких экранах приложение и так грузится мгновенно. */
        @media (min-width: 700px){ .app-splash{ display: none !important; } }
    </style>
    <script>
        // Пакет переводов uk/en грузим лениво и только для выбранного языка;
        // русский встроен в i18n.js. Выбор зеркалит detectLang() из i18n.js.
        (function () {
            var langs = { ru: 1, uk: 1, en: 1 };
            var lang = null;
            try { lang = localStorage.getItem('animei:lang'); } catch (e) { /* приватный режим */ }
            if (!langs[lang]) {
                lang = 'ru';
                var prefs = [navigator.language].concat(navigator.languages || []);
                for (var i = 0; i < prefs.length; i++) {
                    var c = String(prefs[i] || '').toLowerCase().split('-')[0];
                    if (langs[c]) { lang = c; break; }
                }
            }
            if (lang !== 'ru') document.write('<scr' + 'ipt src="./js/i18n/' + lang + '.js" defer></scr' + 'ipt>');
        })();
    </script>
    <script>
        // Резервируем место под динамические блоки главной ДО первой отрисовки.
        // Все условия читаются из localStorage синхронно — сеть тут не нужна.
        // Без этого статичный блок «Ещё» рисовался первым у самого верха, а
        // через секунду карточки вставлялись НАД ним и сдвигали его на пол-
        // экрана (замеряли CLS 0.17). Условия обязаны совпадать с проверками
        // в renderContinueCard/renderSessionCard/renderWeekActivity (app.js).
        (function () {
            var html = document.documentElement;
            var json = function (k) {
                try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; }
            };
            var key = function (d) {
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')
                    + '-' + String(d.getDate()).padStart(2, '0');
            };
            var lw = json('animei:lastWatch');
            if (lw && lw.id && lw.title) html.classList.add('hub-slot-continue');
            var ls = json('animei:lastSession');
            if (ls && !ls.processed && Array.isArray(ls.words) && ls.words.length) html.classList.add('hub-slot-session');
            // Недельная полоска: кроме кружков её высоту задают строка
            // «🔥 N дней подряд» (на телефоне переносится на свою строку) и
            // баннер-рубеж. Считаем стрик здесь же — иначе они прилетают
            // позже и толкают всё, что ниже. Логика зеркалит
            // renderWeekActivity() в app.js: правим в обоих местах.
            var days = json('srs:days');
            if (Array.isArray(days) && days.length) {
                html.classList.add('hub-slot-week');
                var active = {};
                for (var i = 0; i < days.length; i++) active[days[i]] = 1;
                var cur = new Date();
                cur.setHours(0, 0, 0, 0);
                if (!active[key(cur)]) cur.setDate(cur.getDate() - 1);
                var streak = 0;
                while (active[key(cur)]) { streak++; cur.setDate(cur.getDate() - 1); }
                if (streak > 1) html.classList.add('hub-slot-streak');
                var celebrated = 0;
                try { celebrated = Number(localStorage.getItem('animei:streakMilestone')) || 0; } catch (e) { /* нет доступа */ }
                var marks = [100, 50, 30, 14, 7, 3];
                for (var m = 0; m < marks.length; m++) {
                    if (streak >= marks[m] && marks[m] > celebrated) { html.classList.add('hub-slot-milestone'); break; }
                }
            }
            // План дня есть всегда, но три его состояния разной высоты
            // (пусто и «на сегодня всё» — 185px, «есть что учить» — 171px),
            // поэтому нужное определяем здесь. Расчёт зеркалит srsSummary()
            // из js/study-core.js: правим в обоих местах.
            var words = json('words');
            // Как в srsSummary(): записи без id не считаются коллекцией —
            // иначе тут резервировался бы «план», а app.js рисовал «пусто».
            var list = (Array.isArray(words) ? words : []).filter(function (w) { return w && w.id; });
            var token = null;
            try { token = localStorage.getItem('animei:accessToken'); } catch (e) { /* приватный режим */ }
            var planSlot;
            if (!list.length) {
                // Вошедший с пустой локальной копией (новое устройство): после
                // синка коллекция почти наверняка окажется непустой, поэтому
                // резервируем рабочее состояние, а не «пусто».
                planSlot = token ? 'hub-slot-plan' : 'hub-slot-plan-empty';
            } else {
                var sched = json('srs:schedule:v2') || {};
                var todayKey = key(new Date());
                var due = 0, fresh = 0;
                for (var n = 0; n < list.length; n++) {
                    var sc = sched[list[n].id];
                    if (!sc) fresh++;
                    else if (sc.due <= todayKey) due++;
                }
                var perDay = 20;
                var cfg = json('animei:settings');
                if (cfg && Number(cfg.newPerDay) > 0) perDay = Number(cfg.newPerDay);
                planSlot = (due + Math.min(fresh, perDay)) > 0 ? 'hub-slot-plan' : 'hub-slot-plan-done';
            }
            html.classList.add(planSlot);
        })();
    </script>
</head>
<body>
<div id="app-splash" class="app-splash" aria-hidden="true">
    <div class="app-splash__logo">
        <span class="app-splash__glow"></span>
        <img src="./favicon.svg" alt="" class="app-splash__mark">
    </div>
    <div class="app-splash__name">Animei</div>
    <div class="app-splash__bar"><span></span></div>
</div>
<div class="app">
    <header class="header header--flush-left">
        <div class="header__left">
            <button class="icon-btn menu-btn" aria-label="Menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
        </div>
        <div class="header__logo">
            <img src="./favicon.svg" alt="" class="header__logo-mark">
            <span class="header__logo-text">Animei</span>
        </div>
        <form class="header__search" role="search"><button type="button" class="icon-btn header__search-toggle" aria-label="Search" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button><input class="header__search-input" name="q" type="search" autocomplete="off" data-i18n-placeholder="header.search" placeholder="Поиск аниме"></form>
        <div class="header__right">
            <div class="profile-wrap">
                <button class="icon-btn profile-btn" aria-label="Profile">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
                <div class="profile-menu" id="profile-menu">
                    <a href="#" id="logout-btn" data-i18n="nav.logout">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Слоты главной. Каждый динамический блок стоит в разметке СРАЗУ, но в
         состоянии скелетона (.is-skel) — место занято ещё до первой отрисовки,
         поэтому появление данных не двигает ленту. Показываются только те
         слоты, что включил скрипт-резерватор в <head> (классы hub-slot-*);
         app.js подменяет содержимое и снимает .is-skel. -->
    <div class="hub" id="hub">
        <a class="continue-card is-skel" id="continue-card" aria-hidden="true">
            <span class="continue-card__poster skel"></span>
            <span class="continue-card__info">
                <span class="continue-card__label"><i class="skel skel-bar" style="width:110px"></i></span>
                <span class="continue-card__title"><i class="skel skel-bar" style="width:150px"></i></span>
                <span class="continue-card__meta"><i class="skel skel-bar" style="width:90px"></i></span>
            </span>
        </a>

        <!-- Слова из последнего просмотра — компактная строка (тап → все слова
             сессии в приоритет учёбы). Наполняет app.js (renderSessionCard). -->
        <a class="session-card is-skel" id="session-card" href="./pages/study.html" aria-hidden="true">
            <span class="session-card__chip skel"><i class="skel-close-spacer"></i></span>
        </a>

        <!-- Дневной план — ядро главной: конечная порция на сегодня (due + fresh +
             оценка времени + состояние «на сегодня всё»). Наполняет app.js. -->
        <a class="daily-plan is-skel" id="daily-plan" href="./pages/study.html" aria-hidden="true">
            <span class="daily-plan__ring skel skel-circle"></span>
            <span class="daily-plan__body">
                <span class="daily-plan__eyebrow"><i class="skel skel-bar" style="width:100px"></i></span>
                <span class="daily-plan__headline"><i class="skel skel-bar" style="width:120px"></i></span>
                <span class="daily-plan__chips"><i class="dp-chip skel"><i class="skel-bar" style="width:64px"></i></i></span>
                <!-- Подпись у состояний «пусто» и «на сегодня всё» реально занимает
                     две строки: первая заглушка во всю ширину заставляет вторую
                     перенестись, поэтому высота совпадает без магических пикселей. -->
                <span class="daily-plan__sub"><i class="skel skel-bar" style="width:100%"></i><i class="skel skel-bar" style="width:58%"></i></span>
            </span>
            <span class="daily-plan__cta skel"><i class="skel-fill"></i></span>
        </a>

        <!-- Недельная активность: стрик и дни занятий. Наполняет app.js. -->
        <div class="week-strip is-skel" id="week-strip" aria-hidden="true">
            <span class="week-strip__days">
                <span class="week-day skel skel-circle"></span><span class="week-day skel skel-circle"></span>
                <span class="week-day skel skel-circle"></span><span class="week-day skel skel-circle"></span>
                <span class="week-day skel skel-circle"></span><span class="week-day skel skel-circle"></span>
                <span class="week-day skel skel-circle"></span>
            </span>
            <span class="week-strip__streak"><i class="skel skel-bar" style="width:104px"></i></span>
            <span class="week-strip__milestone skel"><i class="skel-fill"></i></span>
        </div>

        <!-- Вторичное: способы пополнять словарь и прочие режимы. Раньше
             конкурировали с учёбой на первом уровне — теперь понижены. -->
        <div class="hub-more">
            <span class="hub-more__title" data-i18n="hub.more">Ещё</span>
            <div class="hub-more__grid">
                <a href="./pages/catalog.html" class="mini-card">
                    <span class="mini-card__icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polygon points="10 9 16 12 10 15 10 9" fill="currentColor" stroke="none"/></svg>
                    </span>
                    <span class="mini-card__label" data-i18n="hub.watchAnime">Смотреть аниме</span>
                </a>
                <a href="./pages/beginner.html" class="mini-card">
                    <span class="mini-card__icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4-2 7-6 7-11V5l-7-3-7 3v6c0 5 3 9 7 11z"/><path d="M9 12l2 2 4-4"/></svg>
                    </span>
                    <span class="mini-card__label" data-i18n="hub.beginner">Для новичков</span>
                </a>
                <a href="./pages/custom-study.html" class="mini-card" id="custom-study-card">
                    <span class="mini-card__icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
                    </span>
                    <span class="mini-card__label" data-i18n="hub.custom">Повторить всё</span>
                </a>
                <!-- «Своё видео» (watch.html) не добавляем: страница временно
                     скрыта продуктом — см. правило a[href$="watch.html"] в misc.css. -->
            </div>
        </div>

        <!-- Установка PWA — тихая строка внизу главной. Показывается только
             когда установка реально возможна: Android/Chrome (поймали
             beforeinstallprompt) или iOS (инструкция «Поделиться → На экран
             „Домой“»). Скрывается в установленном приложении и после отказа.
             Логика — renderInstallHint() в app.js. -->
        <div class="install-hint" id="install-hint" hidden>
            <div class="install-hint__row">
                <button class="install-hint__btn" type="button" id="install-hint-btn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>
                    <span data-i18n="install.cta">Установить приложение</span>
                </button>
                <button class="install-hint__close" type="button" id="install-hint-close" data-i18n-title="install.hide" aria-label="Скрыть">×</button>
            </div>
            <p class="install-hint__ios" id="install-hint-ios" hidden data-i18n="install.ios"></p>
        </div>
    </div>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar__brand">Animei</div>
        <a href="./index.html" class="active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/></svg><span class="nav-label" data-i18n="nav.home">Home</span></a>
        <a href="./pages/catalog.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span class="nav-label" data-i18n="nav.catalog">Поиск аниме</span></a>
        <a href="./pages/watch.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polygon points="10 9 16 12 10 15 10 9" fill="currentColor" stroke="none"/></svg><span class="nav-label" data-i18n="nav.watch">Watch</span></a>
        <a href="./pages/words.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span class="nav-label" data-i18n="nav.dictionary">Dictionary</span></a>
        <a href="/news/"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13v14a2 2 0 0 0 2 2H5a2 2 0 0 1-2-2V6a1 1 0 0 1 1-1z"/><line x1="7" y1="9" x2="14" y2="9"/><line x1="7" y1="13" x2="14" y2="13"/><line x1="7" y1="17" x2="11" y2="17"/></svg><span class="nav-label" data-i18n="nav.news">JP News</span><span class="nav-new">NEW</span></a>
        <a href="./pages/feedback.html"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z"/></svg><span class="nav-label" data-i18n="nav.feedback">Feedback</span></a>
    </nav>
    <div class="overlay" id="overlay"></div>
</div>

<script src="./js/app.js" defer></script>

<script>
    // Прячем сплэш сразу по готовности страницы (без искусственной задержки),
    // с аварийным потолком, чтобы сплэш не завис при ошибке.
    (function () {
        var s = document.getElementById('app-splash');
        if (!s) return;
        var done = false;
        function hide() {
            if (done) return; done = true;
            s.classList.add('is-hiding');
            setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 500);
        }
        if (document.readyState === 'complete') hide();
        else window.addEventListener('load', hide);
        setTimeout(hide, 4000);
    })();
</script>
</body>
</html>
