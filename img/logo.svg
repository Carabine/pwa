<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="an-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5c94"/>
      <stop offset="1" stop-color="#8b3ff0"/>
    </linearGradient>
  </defs>

  <!-- Полноэкранный фон край-в-край: для maskable-иконки Android сам обрежет
       углы под свою форму, белого фона не остаётся. -->
  <rect width="512" height="512" fill="url(#an-bg)"/>

  <!-- Одна катакана ア («a», начало Animei) — держим в безопасной зоне маски. -->
  <text x="256" y="358" text-anchor="middle"
        font-family="Yu Gothic, 'Yu Gothic UI', 'MS Gothic', 'Noto Sans JP', sans-serif"
        font-weight="700" font-size="300" fill="#ffffff">ア</text>
</svg>
